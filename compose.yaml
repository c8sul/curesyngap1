services:
  agent:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Code and prompt are mounted so a reload picks up edits without a rebuild.
      - ./src:/app/src
      - ./prompts:/app/prompts
    command:
      - uvicorn
      - --factory
      - app.main:create_app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src

  # Local agent loop with no Twilio account: `docker compose run --rm chat`
  chat:
    build: .
    env_file: .env
    volumes:
      - ./src:/app/src
      - ./prompts:/app/prompts
      - ./scripts:/app/scripts
    command: ["python", "scripts/chat.py"]

  # One-time Twilio resource creation:
  #   docker compose run --rm provision --webhook-domain <public-host>
  provision:
    build: .
    env_file: .env
    volumes:
      - ./scripts:/app/scripts
    entrypoint: ["python", "scripts/provision.py"]

  # `docker compose run --rm test`
  test:
    build:
      context: .
      args:
        EXTRAS: dev
    volumes:
      - ./pyproject.toml:/app/pyproject.toml
      - ./src:/app/src
      - ./tests:/app/tests
      - ./prompts:/app/prompts
    command: ["pytest", "-q"]
