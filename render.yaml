# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Create or update the service from this file with Render's Blueprints flow,
# which reads it from the repository. The secrets are marked `sync: false`, so
# Render prompts for them once and stores them; they are never held here.
#
# The public URL this service is assigned has to reach Twilio in one place this
# file does not control: the Conversation Configuration's status callback. Run
# `docker compose run --rm provision --webhook-domain <host>` with the Render
# host to point it here.
services:
  - type: web
    name: curesyngap1-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # `python -m app.main` serves TAC's app directly and so carries no
    # /healthz, which `create_app()` adds. Render routes traffic to $PORT.
    dockerCommand: uvicorn --factory app.main:create_app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    # A deploy tracks what has been reviewed and merged.
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Secrets. Render prompts for each on first sync and keeps it thereafter.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY
        sync: false
      - key: TWILIO_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Account resources. Ids rather than secrets, but they differ per account,
      # so they are prompted for too rather than baked in.
      - key: TWILIO_CONVERSATION_CONFIGURATION_ID
        sync: false
      - key: TWILIO_MEMORY_STORE_ID
        sync: false
      - key: TWILIO_KNOWLEDGE_BASE_ID
        sync: false
      # The sender, and the only sender configuration there is. The agent sends
      # as this Messaging Service, and provisioning reads its Senders page —
      # phone numbers, short codes, WhatsApp — to build the capture rules that
      # decide what reaches the agent. So adding a sender to the service and
      # re-provisioning is the whole of adding a sender; nothing is listed here
      # to be kept in step with it. The toll-free SMS sender +18557705019 is in
      # this service and its verification is approved.
      # The service must not carry an inbound webhook or auto-reply of its own,
      # or a contact gets the agent's answer alongside it.
      #
      # TWILIO_PHONE_NUMBER and TWILIO_WHATSAPP_NUMBER are deliberately absent:
      # they configured senders before this and now configure nothing. Setting
      # either changes no behaviour.
      - key: TWILIO_MESSAGING_SERVICE_SID
        value: MG81a3a0597d8befe7fb1b74732102b08a
      # Agent tuning. These match .env.example; see it for what each does.
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: AGENT_REASONING_EFFORT
        value: none
      - key: AGENT_TIMEOUT_SECONDS
        value: "25"
      - key: AGENT_MAX_TOOL_ITERATIONS
        value: "3"
      - key: KB_TOP_K
        value: "5"
      - key: KB_MIN_SCORE
        value: "0.3"
      # Recall of what is remembered about a family. What may be retained is an
      # open decision; see docs/decisions.md before pointing real families here.
      - key: MEMORY_MODE
        value: always
      - key: TWILIO_LOG_LEVEL
        value: INFO
