[project]
name = "curesyngap1-agent"
version = "0.1.0"
description = "SMS information agent for CURE SYNGAP1"
requires-python = ">=3.12,<4"
dependencies = [
    "twilio-agent-connect[server]==2.4.0",
    "openai==3.14.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
]
# Reading render.yaml in scripts/deploy.py. Not needed to serve a message.
deploy = [
    "pyyaml==6.0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
